<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Осложнения бронхоэктатической болезни</title>
  <desc id="opisanie">В центре — расширенный бронх с застоем гнойной мокроты, от него расходятся
    четыре пути. Лёгочные осложнения: гной распространяется по соседству — пневмония,
    абсцедирование, эмпиема плевры. Кровотечение: разрушаются расширенные бронхиальные артерии,
    отсюда кровохарканье и профузное лёгочное кровотечение. Дыхательная недостаточность и лёгочное
    сердце: часть лёгкого выключена из дыхания годами, растёт давление в малом круге, правый
    желудочек гипертрофируется. Системные осложнения: длительное гнойное воспаление даёт амилоидоз
    внутренних органов, прежде всего почек, а также истощение и анемию.</desc>

  <rect width="940" height="660" fill="#ffffff"/>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif">
    <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#3f4550">
      Чем опасен застой гноя в расширенных бронхах
    </text>

    <!-- Центр: расширенный бронх -->
    <ellipse cx="470" cy="330" rx="118" ry="66" fill="#fbf1ec" stroke="#bf6a58" stroke-width="3"/>
    <path d="M 440 292 L 440 316 C 424 326, 426 358, 452 360 C 480 362, 486 330, 470 318 L 470 292 Z"
          fill="#e8c98f" stroke="#8c6b3a" stroke-width="2"/>
    <text x="470" y="392" text-anchor="middle" font-size="17" font-weight="600" fill="#8c4a3c">Расширенный бронх,</text>
    <text x="470" y="414" text-anchor="middle" font-size="17" font-weight="600" fill="#8c4a3c">застой гнойной мокроты</text>

    <!-- Лучи -->
    <g stroke="#b3705b" stroke-width="2.5" fill="none">
      <path d="M 400 278 L 300 196"/>
      <path d="M 540 278 L 640 196"/>
      <path d="M 400 382 L 300 462"/>
      <path d="M 540 382 L 640 462"/>
    </g>

    <!-- Лёгочные -->
    <rect x="40" y="84" width="286" height="130" rx="12" fill="#fdfaf8" stroke="#c9a898" stroke-width="2"/>
    <text x="183" y="116" text-anchor="middle" font-size="18" font-weight="600" fill="#8c4a3c">Лёгочные</text>
    <line x1="70" y1="130" x2="296" y2="130" stroke="#e6d5cd" stroke-width="2"/>
    <text x="183" y="158" text-anchor="middle" font-size="16" fill="#3f4550">пневмония вокруг очага</text>
    <text x="183" y="182" text-anchor="middle" font-size="16" fill="#3f4550">абсцедирование</text>
    <text x="183" y="206" text-anchor="middle" font-size="16" fill="#3f4550">эмпиема плевры</text>

    <!-- Кровотечение -->
    <rect x="614" y="84" width="286" height="130" rx="12" fill="#fbeeea" stroke="#bf6a58" stroke-width="2.5"/>
    <text x="757" y="116" text-anchor="middle" font-size="18" font-weight="600" fill="#7d3b2d">Кровотечение</text>
    <line x1="644" y1="130" x2="870" y2="130" stroke="#e6d5cd" stroke-width="2"/>
    <text x="757" y="158" text-anchor="middle" font-size="16" fill="#3f4550">разрушены расширенные</text>
    <text x="757" y="180" text-anchor="middle" font-size="16" fill="#3f4550">бронхиальные артерии</text>
    <text x="757" y="204" text-anchor="middle" font-size="16" font-weight="600" fill="#7d3b2d">кровохарканье, профузное</text>

    <!-- Дыхательная недостаточность -->
    <rect x="40" y="470" width="286" height="140" rx="12" fill="#eef3f8" stroke="#8fa9c2" stroke-width="2"/>
    <text x="183" y="502" text-anchor="middle" font-size="18" font-weight="600" fill="#3d6182">Сердце и дыхание</text>
    <line x1="70" y1="516" x2="296" y2="516" stroke="#d5dfe9" stroke-width="2"/>
    <text x="183" y="544" text-anchor="middle" font-size="16" fill="#3f4550">часть лёгкого годами</text>
    <text x="183" y="566" text-anchor="middle" font-size="16" fill="#3f4550">выключена из дыхания</text>
    <text x="183" y="594" text-anchor="middle" font-size="16" font-weight="600" fill="#3d6182">лёгочное сердце</text>

    <!-- Системные -->
    <rect x="614" y="470" width="286" height="140" rx="12" fill="#f3f1f7" stroke="#a29ab8" stroke-width="2"/>
    <text x="757" y="502" text-anchor="middle" font-size="18" font-weight="600" fill="#5b5080">Системные</text>
    <line x1="644" y1="516" x2="870" y2="516" stroke="#ddd8e6" stroke-width="2"/>
    <text x="757" y="544" text-anchor="middle" font-size="16" fill="#3f4550">многолетнее гнойное</text>
    <text x="757" y="566" text-anchor="middle" font-size="16" fill="#3f4550">воспаление</text>
    <text x="757" y="594" text-anchor="middle" font-size="16" font-weight="600" fill="#5b5080">амилоидоз почек, анемия</text>

    <text x="470" y="638" text-anchor="middle" font-size="16" fill="#5b626c">
      Все четыре пути растут из одного корня — гной, который не уходит из бронха
    </text>
  </g>
</svg>
