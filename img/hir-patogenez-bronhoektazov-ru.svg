<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Порочный круг патогенеза бронхоэктазов</title>
  <desc id="opisanie">Замкнутый цикл из четырёх звеньев: бактериальная инфекция и колонизация
    ведут к нейтрофильному воспалению с выбросом эластаз, оно разрушает и деформирует стенку
    бронха, из-за чего нарушается очищение от слизи и наступает застой, а застой снова
    поддерживает колонизацию.</desc>

  <rect width="860" height="700" fill="#ffffff"/>

  <defs>
    <!-- markerUnits="userSpaceOnUse" обязателен: по умолчанию наконечник
         масштабируется от толщины линии, и при stroke-width 18 он вырастает
         до полутора сотен пикселей, съедая саму дугу. -->
    <marker id="ostriyo" viewBox="0 0 30 30" refX="8" refY="15"
            markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse"
            orient="auto">
      <path d="M 0 0 L 28 15 L 0 30 z" fill="#4472c4"/>
    </marker>
  </defs>

  <g fill="none" stroke="#4472c4" stroke-width="18" stroke-linecap="butt"
     marker-end="url(#ostriyo)">
    <path d="M 300 128 A 250 250 0 0 1 545 122"/>
    <path d="M 682 255 A 250 250 0 0 1 688 440"/>
    <path d="M 560 572 A 250 250 0 0 1 315 578"/>
    <path d="M 178 445 A 250 250 0 0 1 172 260"/>
  </g>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif" font-size="33"
     font-weight="600" fill="#1b1b1b" text-anchor="middle">

    <text x="205" y="205">Бактериальная
      <tspan x="205" dy="40">инфекция</tspan>
      <tspan x="205" dy="40">и колонизация</tspan>
    </text>

    <text x="655" y="205">Нейтрофильное
      <tspan x="655" dy="40">воспаление</tspan>
      <tspan x="655" dy="40" font-weight="400" font-size="29">(эластазы)</tspan>
    </text>

    <text x="655" y="425">Разрушение
      <tspan x="655" dy="40">и деформация</tspan>
      <tspan x="655" dy="40">стенки бронха</tspan>
    </text>

    <text x="205" y="425">Нарушенное
      <tspan x="205" dy="40">очищение от слизи</tspan>
      <tspan x="205" dy="40" font-weight="400" font-size="29">(застой)</tspan>
    </text>
  </g>
</svg>
