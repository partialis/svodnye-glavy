<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Лечение бронхоэктатической болезни: где проходит граница между терапией и операцией</title>
  <desc id="opisanie">Слева консервативное лечение, оно нужно всем: санация бронхиального дерева —
    постуральный дренаж, дыхательная гимнастика, отхаркивающие и муколитики, лечебная
    бронхоскопия с промыванием; антибиотики по чувствительности флоры мокроты в период
    обострения; при кровохарканье — гемостатическая терапия. Справа хирургическое лечение, оно для
    отобранных: резекция поражённого участка от сегмента до доли, а при двустороннем поражении
    вмешательство делят на два этапа. Между ними — условия, при которых показана операция:
    поражение ограничено и точно очерчено, консервативное лечение не удерживает больного,
    повторяются кровотечения или нагноения, а функция оставшегося лёгкого достаточна. Внизу —
    противопоказания: распространённое двустороннее поражение, тяжёлая дыхательная
    недостаточность и лёгочное сердце, амилоидоз с почечной недостаточностью.</desc>

  <rect width="960" height="640" fill="#ffffff"/>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif">
    <text x="480" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#3f4550">
      Консервативное лечение — всем, операция — отобранным
    </text>

    <!-- Консервативное -->
    <rect x="30" y="66" width="330" height="286" rx="12" fill="#eef3f8" stroke="#5b8bb0" stroke-width="2.5"/>
    <text x="195" y="100" text-anchor="middle" font-size="19" font-weight="600" fill="#3d6182">Консервативное</text>
    <text x="195" y="124" text-anchor="middle" font-size="15" fill="#6b7280">основа у всех больных</text>
    <line x1="58" y1="140" x2="332" y2="140" stroke="#d5dfe9" stroke-width="2"/>
    <text x="58" y="170" font-size="16" font-weight="600" fill="#3d6182">Санация бронхиального дерева</text>
    <text x="70" y="194" font-size="15" fill="#3f4550">постуральный дренаж, дыхательная</text>
    <text x="70" y="216" font-size="15" fill="#3f4550">гимнастика, отхаркивающие</text>
    <text x="70" y="238" font-size="15" fill="#3f4550">лечебная бронхоскопия с промыванием</text>
    <text x="58" y="272" font-size="16" font-weight="600" fill="#3d6182">Антибиотики в обострение</text>
    <text x="70" y="296" font-size="15" fill="#3f4550">по чувствительности флоры мокроты</text>
    <text x="58" y="330" font-size="16" font-weight="600" fill="#3d6182">Гемостатики при кровохарканье</text>

    <!-- Хирургическое -->
    <rect x="600" y="66" width="330" height="286" rx="12" fill="#fbf1ec" stroke="#bf6a58" stroke-width="2.5"/>
    <text x="765" y="100" text-anchor="middle" font-size="19" font-weight="600" fill="#8c4a3c">Хирургическое</text>
    <text x="765" y="124" text-anchor="middle" font-size="15" fill="#6b7280">радикально, но не каждому</text>
    <line x1="628" y1="140" x2="902" y2="140" stroke="#e6d5cd" stroke-width="2"/>
    <text x="628" y="170" font-size="16" font-weight="600" fill="#8c4a3c">Резекция поражённого участка</text>
    <text x="640" y="194" font-size="15" fill="#3f4550">от сегмента до доли — по объёму</text>
    <text x="640" y="216" font-size="15" fill="#3f4550">поражения, а не «с запасом»</text>
    <text x="628" y="250" font-size="16" font-weight="600" fill="#8c4a3c">Двустороннее поражение —</text>
    <text x="628" y="272" font-size="16" font-weight="600" fill="#8c4a3c">в два этапа</text>
    <text x="640" y="296" font-size="15" fill="#3f4550">сначала более поражённая сторона,</text>
    <text x="640" y="318" font-size="15" fill="#3f4550">вторая — после восстановления</text>

    <!-- Условия перехода, между колонками -->
    <rect x="384" y="66" width="192" height="286" rx="12" fill="#fdfaf8" stroke="#c9a898" stroke-width="2"/>
    <text x="480" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#8c4a3c">Когда оперировать</text>
    <line x1="404" y1="112" x2="556" y2="112" stroke="#e6d5cd" stroke-width="2"/>
    <text x="480" y="142" text-anchor="middle" font-size="15" fill="#3f4550">поражение ограничено</text>
    <text x="480" y="164" text-anchor="middle" font-size="15" fill="#3f4550">и точно очерчено</text>
    <text x="480" y="200" text-anchor="middle" font-size="15" fill="#3f4550">терапия не удерживает</text>
    <text x="480" y="222" text-anchor="middle" font-size="15" fill="#3f4550">больного</text>
    <text x="480" y="258" text-anchor="middle" font-size="15" fill="#3f4550">повторные кровотечения</text>
    <text x="480" y="280" text-anchor="middle" font-size="15" fill="#3f4550">или нагноения</text>
    <text x="480" y="316" text-anchor="middle" font-size="15" fill="#3f4550">функции оставшегося</text>
    <text x="480" y="338" text-anchor="middle" font-size="15" fill="#3f4550">лёгкого достаточно</text>

    <g fill="#b3705b">
      <path d="M 360 200 L 372 200 L 372 192 L 384 206 L 372 220 L 372 212 L 360 212 Z"/>
      <path d="M 576 200 L 588 200 L 588 192 L 600 206 L 588 220 L 588 212 L 576 212 Z"/>
    </g>

    <!-- Противопоказания -->
    <rect x="30" y="386" width="900" height="164" rx="12" fill="#f6f3f1" stroke="#a89a92" stroke-width="2"
          stroke-dasharray="7 5"/>
    <text x="480" y="420" text-anchor="middle" font-size="18" font-weight="600" fill="#6b5c54">
      Когда оперировать НЕЛЬЗЯ
    </text>
    <line x1="120" y1="436" x2="840" y2="436" stroke="#ddd5d0" stroke-width="2"/>
    <text x="180" y="472" text-anchor="middle" font-size="16" fill="#3f4550">распространённое</text>
    <text x="180" y="494" text-anchor="middle" font-size="16" fill="#3f4550">двустороннее поражение</text>
    <text x="480" y="472" text-anchor="middle" font-size="16" fill="#3f4550">тяжёлая дыхательная</text>
    <text x="480" y="494" text-anchor="middle" font-size="16" fill="#3f4550">недостаточность, лёгочное сердце</text>
    <text x="780" y="472" text-anchor="middle" font-size="16" fill="#3f4550">амилоидоз с почечной</text>
    <text x="780" y="494" text-anchor="middle" font-size="16" fill="#3f4550">недостаточностью</text>
    <text x="480" y="530" text-anchor="middle" font-size="15" fill="#6b7280">
      В этих случаях резекция отнимает дыхательный резерв, которого уже нет
    </text>

    <text x="480" y="596" text-anchor="middle" font-size="16" fill="#5b626c">
      Бронхоэктаз необратим: терапия удерживает, а убирает его только резекция
    </text>
  </g>
</svg>
