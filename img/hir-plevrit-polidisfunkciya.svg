<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
 <title id="title">Полиорганная дисфункция при эмпиеме плевры</title><desc id="desc">Каскад от гнойного очага и компрессии лёгкого к гипоксии и поражению органов.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker></defs><rect width="1200" height="640" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172554}.h{font-size:29px;font-weight:bold}.l{font-size:21px;font-weight:bold}.s{font-size:17px}.box{fill:#fff;stroke:#2563eb;stroke-width:3}.danger{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.arr{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style>
 <text x="600" y="45" text-anchor="middle" class="h">От эмпиемы плевры к полиорганной дисфункции</text>
 <rect class="danger" x="470" y="78" width="260" height="75" rx="14"/><text x="600" y="109" text-anchor="middle" class="l">Гнойный очаг в плевре</text><text x="600" y="135" text-anchor="middle" class="s">токсины + выпот</text>
 <path class="arr" d="M600 155V205"/><rect class="danger" x="420" y="210" width="360" height="76" rx="14"/><text x="600" y="242" text-anchor="middle" class="l">Компрессия лёгкого и гипоксия</text><text x="600" y="268" text-anchor="middle" class="s">шунтирование крови, дыхательная недостаточность</text>
 <path class="arr" d="M505 288L215 365"/><path class="arr" d="M570 288L465 365"/><path class="arr" d="M630 288L735 365"/><path class="arr" d="M695 288L985 365"/>
 <rect class="box" x="70" y="375" width="260" height="105" rx="14"/><text x="200" y="412" text-anchor="middle" class="l">Сердце и сосуды</text><text x="200" y="440" text-anchor="middle" class="s">гиповолемия,</text><text x="200" y="463" text-anchor="middle" class="s">падение давления</text>
 <rect class="box" x="350" y="375" width="230" height="105" rx="14"/><text x="465" y="412" text-anchor="middle" class="l">Лёгкие</text><text x="465" y="440" text-anchor="middle" class="s">ателектаз,</text><text x="465" y="463" text-anchor="middle" class="s">дыхательная недостаточность</text>
 <rect class="box" x="620" y="375" width="230" height="105" rx="14"/><text x="735" y="412" text-anchor="middle" class="l">Печень</text><text x="735" y="440" text-anchor="middle" class="s">токсическое</text><text x="735" y="463" text-anchor="middle" class="s">поражение</text>
 <rect class="box" x="870" y="375" width="260" height="105" rx="14"/><text x="1000" y="412" text-anchor="middle" class="l">Почки</text><text x="1000" y="440" text-anchor="middle" class="s">снижение перфузии,</text><text x="1000" y="463" text-anchor="middle" class="s">острое повреждение</text>
 <path class="arr" d="M200 485L440 550"/><path class="arr" d="M465 485L520 550"/><path class="arr" d="M735 485L680 550"/><path class="arr" d="M1000 485L760 550"/><rect class="danger" x="420" y="550" width="360" height="60" rx="14"/><text x="600" y="587" text-anchor="middle" class="l">Полиорганная недостаточность</text>
</svg>
