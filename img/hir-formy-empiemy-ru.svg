<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Топографические формы осумкованной эмпиемы плевры</title>
  <desc id="opisanie">Схема грудной клетки спереди. Верхушечная эмпиема лежит над верхушкой лёгкого,
    в куполе плевры, который поднимается на 2–3 см выше ключицы. Пристеночная прилежит к боковой
    стенке грудной клетки между листками плевры. Базальная скапливается над диафрагмой в самом
    нижнем отделе плеврального мешка. Междолевая занимает щель между долями, парамедиастинальная
    прилежит к средостению.</desc>

  <rect width="880" height="640" fill="#ffffff"/>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif">

    <!-- Контур грудной клетки -->
    <path d="M 250 92 C 250 66, 630 66, 630 92 L 648 470 C 648 520, 232 520, 232 470 Z"
          fill="#f7f8fa" stroke="#9aa4b5" stroke-width="3"/>

    <!-- Средостение -->
    <path d="M 424 104 L 456 104 L 470 300 C 470 340, 410 340, 410 300 Z"
          fill="#e3e7ee" stroke="#9aa4b5" stroke-width="2"/>
    <text x="440" y="360" text-anchor="middle" font-size="19" fill="#5b626c">средостение</text>

    <!-- Лёгкие -->
    <path d="M 268 116 C 300 100, 390 104, 402 150 L 402 400 C 402 430, 280 434, 270 400 Z"
          fill="#eef4ec" stroke="#7d9b74" stroke-width="2.5"/>
    <path d="M 612 116 C 580 100, 490 104, 478 150 L 478 400 C 478 430, 600 434, 610 400 Z"
          fill="#eef4ec" stroke="#7d9b74" stroke-width="2.5"/>

    <!-- Междолевая щель справа на схеме -->
    <path d="M 478 244 L 606 210" stroke="#7d9b74" stroke-width="2.5" fill="none"/>

    <!-- Диафрагма -->
    <path d="M 240 452 C 330 412, 550 412, 640 452" fill="none"
          stroke="#9aa4b5" stroke-width="3"/>
    <text x="440" y="486" text-anchor="middle" font-size="19" fill="#5b626c">диафрагма</text>

    <!-- Ключица -->
    <path d="M 262 122 L 400 108" stroke="#b9c0cc" stroke-width="7" stroke-linecap="round"/>
    <path d="M 618 122 L 480 108" stroke="#b9c0cc" stroke-width="7" stroke-linecap="round"/>

    <!-- Скопления гноя -->
    <ellipse cx="322" cy="128" rx="46" ry="26" fill="#c0504d" opacity="0.82"/>
    <ellipse cx="286" cy="286" rx="22" ry="72" fill="#c0504d" opacity="0.82"/>
    <ellipse cx="336" cy="418" rx="62" ry="24" fill="#c0504d" opacity="0.82"/>
    <ellipse cx="545" cy="228" rx="56" ry="17" fill="#c0504d" opacity="0.82"
             transform="rotate(-15 545 228)"/>
    <ellipse cx="492" cy="330" rx="18" ry="56" fill="#c0504d" opacity="0.82"/>

    <!-- Выноски -->
    <g stroke="#6b7280" stroke-width="2" fill="none">
      <path d="M 322 102 L 322 62 L 176 62"/>
      <path d="M 264 286 L 150 286"/>
      <path d="M 300 434 L 220 560 L 176 560"/>
      <path d="M 596 220 L 730 178"/>
      <path d="M 508 330 L 704 366"/>
    </g>
    <g font-size="21" font-weight="600" fill="#1b1b1b">
      <text x="170" y="56" text-anchor="end">Верхушечная</text>
      <text x="170" y="80" text-anchor="end" font-size="18" font-weight="400"
            fill="#5b626c">купол плевры, 2—3 см выше ключицы</text>
      <text x="144" y="280" text-anchor="end">Пристеночная</text>
      <text x="144" y="304" text-anchor="end" font-size="18" font-weight="400"
            fill="#5b626c">боковая стенка грудной клетки</text>
      <text x="170" y="554" text-anchor="end">Базальная</text>
      <text x="170" y="578" text-anchor="end" font-size="18" font-weight="400"
            fill="#5b626c">над диафрагмой</text>
      <text x="738" y="172">Междолевая</text>
      <text x="738" y="196" font-size="18" font-weight="400" fill="#5b626c">в щели между долями</text>
      <text x="712" y="360">Парамедиастинальная</text>
      <text x="712" y="384" font-size="18" font-weight="400" fill="#5b626c">у средостения</text>
    </g>
  </g>
</svg>
