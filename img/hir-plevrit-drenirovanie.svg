<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
 <title id="title">Алгоритм санации эмпиемы плевры</title><desc id="desc">Алгоритм от пункции и дренирования к операции при нерасправляющемся лёгком или хронической эмпиеме.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker></defs><rect width="1200" height="610" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172554}.h{font-size:30px;font-weight:bold}.l{font-size:21px;font-weight:bold}.s{font-size:17px}.box{fill:#fff;stroke:#2563eb;stroke-width:3}.yes{fill:#dcfce7;stroke:#15803d;stroke-width:3}.no{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.arr{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style>
 <text x="600" y="43" text-anchor="middle" class="h">Малоинвазивная санация: когда переходить к операции</text>
 <rect class="box" x="430" y="75" width="340" height="65" rx="13"/><text x="600" y="115" text-anchor="middle" class="l">Эмпиема плевры подтверждена</text><path class="arr" d="M600 142V185"/>
 <rect class="box" x="400" y="190" width="400" height="72" rx="13"/><text x="600" y="221" text-anchor="middle" class="l">Пункция и эвакуация выпота</text><text x="600" y="247" text-anchor="middle" class="s">за один раз — не более 1500 мл</text><path class="arr" d="M600 264V305"/>
 <polygon points="600,305 735,365 600,425 465,365" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="600" y="360" text-anchor="middle" class="l">Выпот рецидивирует</text><text x="600" y="384" text-anchor="middle" class="s">или содержит фибрин?</text>
 <path class="arr" d="M465 365H285V455"/><text x="345" y="350" class="s">нет</text><rect class="yes" x="115" y="460" width="340" height="82" rx="13"/><text x="285" y="494" text-anchor="middle" class="l">Наблюдение и антибиотики</text><text x="285" y="520" text-anchor="middle" class="s">контроль УЗИ / КТ</text>
 <path class="arr" d="M735 365H915V455"/><text x="840" y="350" class="s">да</text><rect class="box" x="750" y="460" width="330" height="82" rx="13"/><text x="915" y="493" text-anchor="middle" class="l">Дренирование и санация</text><text x="915" y="519" text-anchor="middle" class="s">при отсутствии свища — лаваж</text>
 <path class="arr" d="M915 544V575H600V575"/><rect class="no" x="420" y="550" width="360" height="48" rx="13"/><text x="600" y="581" text-anchor="middle" class="l">Нет расправления / хроническая эмпиема → операция</text>
</svg>
