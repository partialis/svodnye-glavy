<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Лучевая диагностика рака лёгкого: порядок методов</title>
  <desc id="opisanie">Каскад сверху вниз. Первый шаг, выявление: флюорография или обзорная
    рентгенография органов грудной клетки в двух проекциях; задача — заметить патологическую тень:
    очаг, узел, инфильтрат или ателектаз. Если изменения найдены, второй шаг — компьютерная
    томография с внутривенным болюсным контрастированием: она оценивает сам узел, его размер,
    контуры и лучистость, проходимость бронхов, прорастание в соседние органы и состояние
    лимфоузлов средостения, то есть стадию N. При подтверждении солитарного образования третий шаг —
    позитронно-эмиссионная томография с фтордезоксиглюкозой от основания черепа до середины бедра:
    она отличает доброкачественный очаг от злокачественного по уровню накопления глюкозы и ищет
    отдалённые метастазы, то есть стадию M. Четвёртый шаг идёт параллельно: магнитно-резонансная
    томография головного мозга с контрастом исключает метастазы в центральной нервной системе, а
    остеосцинтиграфия — если ПЭТ недоступна — ищет метастазы в костях.</desc>

  <rect width="900" height="760" fill="#ffffff"/>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif">

    <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#3f4550">
      От тени на плёнке до полной стадии: чем и в каком порядке смотрят
    </text>

    <!-- Шаг 1 -->
    <rect x="150" y="62" width="600" height="112" rx="12" fill="#f7f8fa" stroke="#9aa4b5" stroke-width="2"/>
    <circle cx="188" cy="118" r="22" fill="#eaf1f8" stroke="#5b8bb0" stroke-width="2"/>
    <text x="188" y="126" text-anchor="middle" font-size="21" font-weight="600" fill="#3d6182">1</text>
    <text x="228" y="96" font-size="18" font-weight="600" fill="#3f4550">Флюорография или рентгенография ОГК в двух проекциях</text>
    <text x="228" y="122" font-size="15" fill="#6b7280">выявление</text>
    <text x="228" y="150" font-size="16" fill="#3f4550">Задача: заметить патологическую тень — очаг, узел, инфильтрат, ателектаз</text>

    <path d="M 450 174 L 450 202 M 440 192 L 450 204 L 460 192" stroke="#8f98a6" stroke-width="3" fill="none"/>
    <text x="466" y="196" font-size="14" fill="#6b7280">изменения найдены</text>

    <!-- Шаг 2 -->
    <rect x="150" y="208" width="600" height="136" rx="12" fill="#eef3f8" stroke="#5b8bb0" stroke-width="2.5"/>
    <circle cx="188" cy="276" r="22" fill="#ffffff" stroke="#5b8bb0" stroke-width="2"/>
    <text x="188" y="284" text-anchor="middle" font-size="21" font-weight="600" fill="#3d6182">2</text>
    <text x="228" y="242" font-size="18" font-weight="600" fill="#3d6182">КТ грудной клетки с внутривенным болюсным контрастом</text>
    <text x="228" y="268" font-size="15" fill="#6b7280">основной метод визуализации</text>
    <text x="228" y="296" font-size="16" fill="#3f4550">Задачи: размер, контуры и лучистость узла; проходимость бронхов;</text>
    <text x="228" y="320" font-size="16" fill="#3f4550">прорастание в соседние органы; лимфоузлы средостения — стадия N</text>

    <path d="M 450 344 L 450 372 M 440 362 L 450 374 L 460 362" stroke="#8f98a6" stroke-width="3" fill="none"/>
    <text x="466" y="366" font-size="14" fill="#6b7280">образование подтверждено</text>

    <!-- Шаг 3 -->
    <rect x="150" y="378" width="600" height="136" rx="12" fill="#f3f1f7" stroke="#8f83ac" stroke-width="2.5"/>
    <circle cx="188" cy="446" r="22" fill="#ffffff" stroke="#8f83ac" stroke-width="2"/>
    <text x="188" y="454" text-anchor="middle" font-size="21" font-weight="600" fill="#5b5080">3</text>
    <text x="228" y="412" font-size="18" font-weight="600" fill="#5b5080">ПЭТ-КТ с 18F-ФДГ: от основания черепа до середины бедра</text>
    <text x="228" y="438" font-size="15" fill="#6b7280">метаболическое стадирование</text>
    <text x="228" y="466" font-size="16" fill="#3f4550">Задачи: отличить доброкачественный очаг от злокачественного</text>
    <text x="228" y="490" font-size="16" fill="#3f4550">по накоплению глюкозы; найти отдалённые метастазы — стадия M</text>

    <!-- Разветвление на шаг 4 -->
    <path d="M 450 514 L 450 540 M 268 540 L 632 540 M 268 540 L 268 566 M 632 540 L 632 566"
          stroke="#8f98a6" stroke-width="2.5" fill="none"/>
    <g fill="#8f98a6">
      <path d="M 259 560 L 268 574 L 277 560 Z"/>
      <path d="M 623 560 L 632 574 L 641 560 Z"/>
    </g>
    <text x="450" y="562" text-anchor="middle" font-size="15" fill="#6b7280">уточняющая диагностика — параллельно</text>

    <!-- Шаг 4: два параллельных блока -->
    <rect x="118" y="578" width="300" height="128" rx="12" fill="#f7f8fa" stroke="#9aa4b5" stroke-width="2"/>
    <circle cx="156" cy="612" r="18" fill="#ffffff" stroke="#9aa4b5" stroke-width="2"/>
    <text x="156" y="619" text-anchor="middle" font-size="17" font-weight="600" fill="#5b626c">4</text>
    <text x="186" y="618" font-size="17" font-weight="600" fill="#3f4550">МРТ головного мозга</text>
    <text x="186" y="640" font-size="17" font-weight="600" fill="#3f4550">с контрастом</text>
    <text x="146" y="674" font-size="15" fill="#3f4550">исключить метастазы в ЦНС —</text>
    <text x="146" y="694" font-size="15" fill="#3f4550">КТ их видит хуже</text>

    <rect x="482" y="578" width="300" height="128" rx="12" fill="#f7f8fa" stroke="#9aa4b5" stroke-width="2"/>
    <circle cx="520" cy="612" r="18" fill="#ffffff" stroke="#9aa4b5" stroke-width="2"/>
    <text x="520" y="619" text-anchor="middle" font-size="17" font-weight="600" fill="#5b626c">4</text>
    <text x="550" y="618" font-size="17" font-weight="600" fill="#3f4550">Остеосцинтиграфия</text>
    <text x="510" y="652" font-size="15" fill="#3f4550">поиск метастазов в костях,</text>
    <text x="510" y="674" font-size="15" fill="#3f4550">когда ПЭТ-КТ недоступна</text>

    <text x="450" y="740" text-anchor="middle" font-size="16" fill="#5b626c">
      Каждый следующий метод отвечает на свой вопрос, а не повторяет предыдущий
    </text>
  </g>
</svg>
