<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Синдром верхней полой вены при раке лёгкого</title>
  <desc id="opisanie">Патогенетическая цепь сверху вниз. Опухоль верхушки или корня правого лёгкого
    либо метастатические лимфоузлы средостения — паратрахеальные и бифуркационные — сдавливают
    снаружи тонкостенную верхнюю полую вену; к сдавлению может присоединиться тромбоз просвета.
    Давление в бассейне вены резко растёт, и застой охватывает голову, шею, верхний плечевой пояс
    и обе руки. Отсюда три группы признаков. Отёчная: отёк лица и шеи, так называемый воротник
    Стокса, отёк конъюнктивы и обеих рук. Сосудистая: цианоз верхней половины туловища, набухание
    яремных вен, сеть подкожных коллатералей на передней грудной стенке. Неврологическая, от
    застоя в центральной нервной системе: распирающая головная боль, головокружение, шум в ушах,
    осиплость голоса из-за отёка голосовых связок.</desc>

  <rect width="900" height="720" fill="#ffffff"/>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif">

    <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#3f4550">
      Почему при раке лёгкого отекает лицо
    </text>

    <!-- Триггер -->
    <rect x="240" y="60" width="420" height="76" rx="12" fill="#fbeeea" stroke="#bf6a58" stroke-width="2.5"/>
    <text x="450" y="90" text-anchor="middle" font-size="17" font-weight="600" fill="#8c4a3c">Опухоль верхушки или корня правого лёгкого,</text>
    <text x="450" y="114" text-anchor="middle" font-size="17" font-weight="600" fill="#8c4a3c">метастазы в лимфоузлы средостения</text>

    <path d="M 450 136 L 450 166 M 440 156 L 450 168 L 460 156" stroke="#b3705b" stroke-width="3" fill="none"/>

    <!-- Сдавление вены: слева схема, справа текст -->
    <rect x="180" y="172" width="540" height="112" rx="12" fill="#f7f8fa" stroke="#9aa4b5" stroke-width="2"/>
    <!-- анатомическая врезка -->
    <rect x="196" y="186" width="112" height="84" rx="8" fill="#ffffff" stroke="#c3cbd8" stroke-width="1.5"/>
    <path d="M 236 192 L 236 250 C 236 262, 258 262, 258 250 L 258 192 Z" fill="#c3d4e6" stroke="#5b8bb0" stroke-width="2"/>
    <text x="252" y="264" font-size="12" fill="#3d6182">ВПВ</text>
    <circle cx="222" cy="216" r="14" fill="#e8b9ab" stroke="#bf6a58" stroke-width="2"/>
    <circle cx="276" cy="232" r="11" fill="#e8b9ab" stroke="#bf6a58" stroke-width="2"/>
    <path d="M 232 216 L 240 218 M 268 230 L 258 228" stroke="#bf6a58" stroke-width="2"/>
    <text x="516" y="214" text-anchor="middle" font-size="17" font-weight="600" fill="#3f4550">Сдавление верхней полой вены снаружи,</text>
    <text x="516" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#3f4550">иногда с тромбозом просвета</text>
    <text x="516" y="262" text-anchor="middle" font-size="15" fill="#5b626c">стенка тонкая, давление в ней низкое — сдавливается легко</text>

    <path d="M 450 284 L 450 314 M 440 304 L 450 316 L 460 304" stroke="#b3705b" stroke-width="3" fill="none"/>

    <!-- Рост давления -->
    <rect x="180" y="320" width="540" height="72" rx="12" fill="#eaf1f8" stroke="#5b8bb0" stroke-width="2.5"/>
    <text x="450" y="350" text-anchor="middle" font-size="17" font-weight="600" fill="#3d6182">Резкий рост венозного давления в бассейне ВПВ:</text>
    <text x="450" y="374" text-anchor="middle" font-size="17" font-weight="600" fill="#3d6182">голова, шея, верхний плечевой пояс, обе руки</text>

    <!-- Разветвление -->
    <path d="M 450 392 L 450 414 M 152 414 L 748 414 M 152 414 L 152 438 M 450 414 L 450 438 M 748 414 L 748 438"
          stroke="#8f98a6" stroke-width="2.5" fill="none"/>
    <g fill="#8f98a6">
      <path d="M 143 432 L 152 446 L 161 432 Z"/>
      <path d="M 441 432 L 450 446 L 459 432 Z"/>
      <path d="M 739 432 L 748 446 L 757 432 Z"/>
    </g>

    <!-- Отёчный синдром -->
    <rect x="26" y="450" width="252" height="226" rx="12" fill="#fdfaf8" stroke="#c9a898" stroke-width="2"/>
    <text x="152" y="482" text-anchor="middle" font-size="18" font-weight="600" fill="#8c4a3c">Отёчный</text>
    <line x1="54" y1="496" x2="250" y2="496" stroke="#e6d5cd" stroke-width="2"/>
    <text x="152" y="526" text-anchor="middle" font-size="16" fill="#3f4550">отёк лица и шеи —</text>
    <text x="152" y="550" text-anchor="middle" font-size="16" font-weight="600" fill="#8c4a3c">«воротник Стокса»</text>
    <text x="152" y="580" text-anchor="middle" font-size="16" fill="#3f4550">отёк конъюнктивы</text>
    <text x="152" y="610" text-anchor="middle" font-size="16" fill="#3f4550">отёк обеих рук</text>
    <text x="152" y="648" text-anchor="middle" font-size="14" fill="#5b626c">усиливается лёжа</text>
    <text x="152" y="666" text-anchor="middle" font-size="14" fill="#5b626c">и при наклоне вперёд</text>

    <!-- Сосудистый синдром -->
    <rect x="324" y="450" width="252" height="226" rx="12" fill="#eef3f8" stroke="#8fa9c2" stroke-width="2"/>
    <text x="450" y="482" text-anchor="middle" font-size="18" font-weight="600" fill="#3d6182">Сосудистый</text>
    <line x1="352" y1="496" x2="548" y2="496" stroke="#d5dfe9" stroke-width="2"/>
    <text x="450" y="526" text-anchor="middle" font-size="16" fill="#3f4550">цианоз верхней</text>
    <text x="450" y="548" text-anchor="middle" font-size="16" fill="#3f4550">половины туловища</text>
    <text x="450" y="578" text-anchor="middle" font-size="16" fill="#3f4550">набухание яремных вен</text>
    <text x="450" y="608" text-anchor="middle" font-size="16" fill="#3f4550">сеть коллатералей —</text>
    <text x="450" y="630" text-anchor="middle" font-size="16" font-weight="600" fill="#3d6182">«голова медузы»</text>
    <text x="450" y="662" text-anchor="middle" font-size="14" fill="#5b626c">на передней грудной стенке</text>

    <!-- Неврологический синдром -->
    <rect x="622" y="450" width="252" height="226" rx="12" fill="#f3f1f7" stroke="#a29ab8" stroke-width="2"/>
    <text x="748" y="482" text-anchor="middle" font-size="18" font-weight="600" fill="#5b5080">Неврологический</text>
    <line x1="650" y1="496" x2="846" y2="496" stroke="#ddd8e6" stroke-width="2"/>
    <text x="748" y="526" text-anchor="middle" font-size="16" fill="#3f4550">распирающая</text>
    <text x="748" y="548" text-anchor="middle" font-size="16" fill="#3f4550">головная боль</text>
    <text x="748" y="578" text-anchor="middle" font-size="16" fill="#3f4550">головокружение,</text>
    <text x="748" y="600" text-anchor="middle" font-size="16" fill="#3f4550">шум в ушах</text>
    <text x="748" y="630" text-anchor="middle" font-size="16" fill="#3f4550">осиплость голоса</text>
    <text x="748" y="662" text-anchor="middle" font-size="14" fill="#5b626c">от отёка голосовых связок</text>

    <text x="450" y="704" text-anchor="middle" font-size="16" fill="#5b626c">
      Все три группы признаков — следствие одного препятствия, а не трёх разных болезней
    </text>
  </g>
</svg>
