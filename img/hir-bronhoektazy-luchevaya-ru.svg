<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700"
     role="img" aria-labelledby="zagolovok opisanie">
  <title id="zagolovok">Лучевая диагностика бронхоэктатической болезни</title>
  <desc id="opisanie">Сверху вниз три ступени. Обзорная рентгенограмма грудной клетки в двух
    проекциях видит лишь косвенные признаки: усиление и ячеистость лёгочного рисунка, уменьшение
    объёма доли, смещение средостения в больную сторону; нормальный снимок бронхоэктазы не
    исключает. Компьютерная томография высокого разрешения — метод выбора, она показывает сами
    расширенные бронхи: симптом перстня, когда просвет бронха шире идущей рядом артерии, отсутствие
    сужения бронха к периферии, видимость бронхов в наружной части лёгкого, утолщение их стенок.
    Бронхография с контрастом сегодня применяется редко и только перед операцией, чтобы точно
    очертить объём поражения; она заполняет расширенные бронхи контрастом и показывает их форму —
    цилиндрическую, веретенообразную, мешотчатую или смешанную.</desc>

  <rect width="940" height="700" fill="#ffffff"/>

  <g font-family="Golos Text, Segoe UI, Arial, sans-serif">
    <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#3f4550">
      Чем ищут бронхоэктазы и что каждый метод показывает
    </text>

    <!-- Ступень 1 -->
    <rect x="90" y="62" width="760" height="140" rx="12" fill="#f7f8fa" stroke="#9aa4b5" stroke-width="2"/>
    <circle cx="132" cy="132" r="22" fill="#eceff4" stroke="#9aa4b5" stroke-width="2"/>
    <text x="132" y="140" text-anchor="middle" font-size="20" font-weight="600" fill="#5b626c">1</text>
    <text x="172" y="98" font-size="18" font-weight="600" fill="#3f4550">Обзорная рентгенограмма в двух проекциях</text>
    <text x="172" y="124" font-size="15" fill="#6b7280">первый шаг, видит только косвенное</text>
    <text x="172" y="152" font-size="16" fill="#3f4550">Усиление и ячеистость лёгочного рисунка, уменьшение объёма доли,</text>
    <text x="172" y="176" font-size="16" fill="#3f4550">смещение средостения в больную сторону</text>
    <rect x="700" y="88" width="130" height="96" rx="8" fill="#ffffff" stroke="#c3cbd8" stroke-width="1.5"/>
    <path d="M 716 100 C 730 92, 756 94, 760 116 L 760 168 C 758 176, 720 178, 716 168 Z"
          fill="#f2f4f7" stroke="#9aa4b5" stroke-width="1.5"/>
    <path d="M 814 100 C 800 92, 774 94, 770 116 L 770 168 C 772 176, 810 178, 814 168 Z"
          fill="#e6e9ef" stroke="#9aa4b5" stroke-width="1.5"/>
    <g stroke="#8f98a6" stroke-width="1" fill="none">
      <path d="M 776 120 L 806 126 M 776 134 L 806 138 M 776 148 L 804 150"/>
    </g>
    <text x="765" y="196" text-anchor="middle" font-size="13" fill="#6b7280">ячеистость слева</text>

    <path d="M 470 202 L 470 232 M 460 222 L 470 234 L 480 222" stroke="#8f98a6" stroke-width="3" fill="none"/>
    <text x="486" y="226" font-size="14" fill="#6b7280">нормальный снимок бронхоэктазы НЕ исключает</text>

    <!-- Ступень 2 -->
    <rect x="90" y="238" width="760" height="182" rx="12" fill="#eef3f8" stroke="#5b8bb0" stroke-width="2.5"/>
    <circle cx="132" cy="330" r="22" fill="#ffffff" stroke="#5b8bb0" stroke-width="2"/>
    <text x="132" y="338" text-anchor="middle" font-size="20" font-weight="600" fill="#3d6182">2</text>
    <text x="172" y="274" font-size="18" font-weight="600" fill="#3d6182">Компьютерная томография высокого разрешения</text>
    <text x="172" y="300" font-size="15" fill="#6b7280">метод выбора — видит сами расширенные бронхи</text>
    <text x="172" y="330" font-size="16" fill="#3f4550">Симптом перстня: просвет бронха шире идущей рядом артерии</text>
    <text x="172" y="354" font-size="16" fill="#3f4550">Бронх не сужается к периферии и виден в наружной части лёгкого</text>
    <text x="172" y="378" font-size="16" fill="#3f4550">Стенки бронхов утолщены</text>
    <!-- симптом перстня -->
    <circle cx="762" cy="316" r="34" fill="#ffffff" stroke="#3d6182" stroke-width="3"/>
    <circle cx="762" cy="316" r="24" fill="#f2f6fa" stroke="#8fa9c2" stroke-width="1.5"/>
    <circle cx="800" cy="336" r="11" fill="#c9a898" stroke="#a8785f" stroke-width="2"/>
    <text x="770" y="378" text-anchor="middle" font-size="13" fill="#6b7280">бронх шире артерии</text>

    <path d="M 470 420 L 470 450 M 460 440 L 470 452 L 480 440" stroke="#8f98a6" stroke-width="3" fill="none"/>
    <text x="486" y="444" font-size="14" fill="#6b7280">если планируется операция</text>

    <!-- Ступень 3 -->
    <rect x="90" y="456" width="760" height="176" rx="12" fill="#f7f8fa" stroke="#9aa4b5" stroke-width="2"/>
    <circle cx="132" cy="544" r="22" fill="#ffffff" stroke="#9aa4b5" stroke-width="2"/>
    <text x="132" y="552" text-anchor="middle" font-size="20" font-weight="600" fill="#5b626c">3</text>
    <text x="172" y="492" font-size="18" font-weight="600" fill="#3f4550">Бронхография с контрастом</text>
    <text x="172" y="518" font-size="15" fill="#6b7280">сегодня редко и только перед операцией</text>
    <text x="172" y="548" font-size="16" fill="#3f4550">Заполняет расширенные бронхи и очерчивает объём поражения:</text>
    <text x="172" y="572" font-size="16" fill="#3f4550">цилиндрические, веретенообразные, мешотчатые, смешанные</text>
    <!-- формы бронхоэктазов -->
    <g stroke="#8c6b3a" stroke-width="2.5" fill="#e8c98f">
      <path d="M 700 500 L 700 540 L 712 540 L 712 500 Z"/>
      <path d="M 730 500 C 726 516, 726 524, 730 540 L 744 540 C 748 524, 748 516, 744 500 Z"/>
      <path d="M 764 500 L 764 516 C 754 522, 754 540, 770 540 C 786 540, 786 522, 776 516 L 776 500 Z"/>
      <path d="M 800 500 L 800 512 C 794 518, 796 528, 804 530 L 804 540 L 816 540 L 816 524 C 822 518, 818 508, 812 506 L 812 500 Z"/>
    </g>
    <text x="762" y="562" text-anchor="middle" font-size="13" fill="#6b7280">четыре формы</text>

    <text x="470" y="672" text-anchor="middle" font-size="16" fill="#5b626c">
      Обзорный снимок ставит вопрос, томография отвечает, бронхография нужна хирургу
    </text>
  </g>
</svg>
