<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
 <title id="title">Пути прорыва эмпиемы плевры</title><desc id="desc">Схема показывает внутренний прорыв в бронх и наружный прорыв через грудную стенку.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="1200" height="590" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172554}.h{font-size:30px;font-weight:bold}.l{font-size:21px;font-weight:bold}.s{font-size:17px}.wall{fill:#dbeafe;stroke:#1e3a8a;stroke-width:4}.lung{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.pus{fill:#dc2626;stroke:#991b1b;stroke-width:3}.arr{stroke:#b91c1c;stroke-width:5;fill:none;marker-end:url(#a)}</style>
 <text x="600" y="45" text-anchor="middle" class="h">Два направления спонтанного прорыва эмпиемы</text><path class="wall" d="M355 105 Q600 25 845 105 L900 500 Q600 555 300 500Z"/><ellipse class="lung" cx="525" cy="305" rx="125" ry="180"/><ellipse class="lung" cx="685" cy="305" rx="115" ry="180"/><path d="M596 145V420" stroke="#0f172a" stroke-width="16"/><path d="M596 215L530 270M596 215L660 270" stroke="#0f172a" stroke-width="13" fill="none"/>
 <ellipse class="pus" cx="425" cy="330" rx="63" ry="85"/><path class="arr" d="M445 305 C495 275 515 270 535 270"/><text x="85" y="245" class="l">В бронх</text><text x="85" y="273" class="s">бронхоплевральный свищ</text><text x="85" y="300" class="s">→ пиопневмоторакс</text><path class="arr" d="M365 365 C285 385 235 405 155 425"/><text x="70" y="465" class="l">Наружу</text><text x="70" y="492" class="s">через межрёберные мышцы</text><text x="70" y="519" class="s">→ empyema necessitatis</text><circle cx="150" cy="426" r="13" fill="#dc2626"/>
 <text x="600" y="575" text-anchor="middle" class="s">Внутренний прорыв опасен аспирацией, наружный — распространением инфекции на грудную стенку.</text>
</svg>
