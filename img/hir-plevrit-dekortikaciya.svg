<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
 <title id="title">Декортикация лёгкого</title><desc id="desc">Три этапа удаления фиброзных шварт с висцеральной плевры.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker></defs><rect width="1200" height="560" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172554}.h{font-size:30px;font-weight:bold}.l{font-size:21px;font-weight:bold}.s{font-size:17px}.panel{fill:#fff;stroke:#94a3b8;stroke-width:3}.lung{fill:#e0f2fe;stroke:#0369a1;stroke-width:4}.peel{fill:#cbd5e1;stroke:#475569;stroke-width:4}.tool{stroke:#b91c1c;stroke-width:7;fill:none}.arr{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style>
 <text x="600" y="45" text-anchor="middle" class="h">Декортикация лёгкого: освобождение от фиброзных шварт</text>
 <g transform="translate(60 95)"><rect class="panel" width="320" height="355" rx="16"/><text x="160" y="42" text-anchor="middle" class="l">1. Ригидная капсула</text><path class="peel" d="M95 115 Q160 65 225 115 Q275 250 225 330 Q160 380 95 330 Q45 250 95 115Z"/><path class="lung" d="M112 138 Q160 100 208 138 Q240 250 208 305 Q160 342 112 305 Q80 250 112 138Z"/><text x="160" y="400" text-anchor="middle" class="s">шварты не дают лёгкому</text><text x="160" y="423" text-anchor="middle" class="s">расправиться</text></g>
 <path class="arr" d="M390 270H455"/>
 <g transform="translate(470 95)"><rect class="panel" width="320" height="355" rx="16"/><text x="160" y="42" text-anchor="middle" class="l">2. Отделение шварт</text><path class="peel" d="M95 115 Q160 65 225 115 Q275 250 225 330 Q160 380 95 330 Q45 250 95 115Z"/><path class="lung" d="M112 138 Q160 100 208 138 Q240 250 208 305 Q160 342 112 305 Q80 250 112 138Z"/><path class="tool" d="M275 150 Q235 190 220 235"/><text x="160" y="400" text-anchor="middle" class="s">слой за слоем удаляют</text><text x="160" y="423" text-anchor="middle" class="s">фиброзную оболочку</text></g>
 <path class="arr" d="M800 270H865"/>
 <g transform="translate(880 95)"><rect class="panel" width="260" height="355" rx="16"/><text x="130" y="42" text-anchor="middle" class="l">3. Расправление</text><path class="lung" d="M60 115 Q130 62 200 115 Q245 250 200 335 Q130 385 60 335 Q15 250 60 115Z"/><text x="130" y="400" text-anchor="middle" class="s">эластичность и объём</text><text x="130" y="423" text-anchor="middle" class="s">дыхания восстанавливаются</text></g>
 <text x="600" y="520" text-anchor="middle" class="s">При хронической эмпиеме дренаж не устранит плотную фиброзную оболочку.</text>
</svg>
